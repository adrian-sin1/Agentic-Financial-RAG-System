name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Run retrieval eval (fails the build below the pass threshold)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PEM: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PEM }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: python eval/run_eval.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (validation only, not pushed)
        run: docker build -t financial-rag-api:ci .

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Terraform apply (redeploy Azure Container App with the new image)
        working-directory: terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_ACCESS_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          TF_VAR_container_image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          TF_VAR_storage_account_name: financialragstorage2026
          TF_VAR_app_env_vars: >-
            {
              "SNOWFLAKE_ACCOUNT": ${{ toJSON(secrets.SNOWFLAKE_ACCOUNT) }},
              "SNOWFLAKE_USER": ${{ toJSON(secrets.SNOWFLAKE_USER) }},
              "SNOWFLAKE_PRIVATE_KEY_PEM": ${{ toJSON(secrets.SNOWFLAKE_PRIVATE_KEY_PEM) }},
              "SNOWFLAKE_DATABASE": ${{ toJSON(secrets.SNOWFLAKE_DATABASE) }},
              "SNOWFLAKE_SCHEMA": ${{ toJSON(secrets.SNOWFLAKE_SCHEMA) }},
              "SNOWFLAKE_WAREHOUSE": ${{ toJSON(secrets.SNOWFLAKE_WAREHOUSE) }},
              "SNOWFLAKE_ROLE": ${{ toJSON(secrets.SNOWFLAKE_ROLE) }},
              "PINECONE_API_KEY": ${{ toJSON(secrets.PINECONE_API_KEY) }},
              "PINECONE_INDEX_NAME": ${{ toJSON(secrets.PINECONE_INDEX_NAME) }},
              "OPENAI_API_KEY": ${{ toJSON(secrets.OPENAI_API_KEY) }},
              "HF_API_TOKEN": ${{ toJSON(secrets.HF_API_TOKEN) }},
              "CHAT_API_KEY": ${{ toJSON(secrets.CHAT_API_KEY) }},
              "AZURE_STORAGE_CONNECTION_STRING": ${{ toJSON(secrets.AZURE_STORAGE_CONNECTION_STRING) }},
              "AZURE_CONTAINER_NAME": ${{ toJSON(secrets.AZURE_CONTAINER_NAME) }},
              "PORT": "8000"
            }
        run: |
          terraform init
          terraform apply -auto-approve
